# === Email通知設定 ===
# 重要度 S/A のプロジェクト登録時にメール通知を送信します。
# Gmailの場合は「アプリパスワード」（16文字）が必要です。
# Google アカウント → セキュリティ → 2段階認証 → アプリパスワード から発行できます。

[email]
smtp_host     = "smtp.gmail.com"
smtp_port     = 587
smtp_user     = "youraddress@gmail.com"
smtp_password = "xxxx xxxx xxxx xxxx"   # Googleアプリパスワード
email_to      = "notify@example.com"
